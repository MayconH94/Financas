<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1b1d21" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finflow" />
    <link rel="preload" href="/fonts/roboto-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Finflow</title>
    <script>
      // aplica o tema antes de pintar a página (evita piscar escuro -> claro)
      (function () {
        try {
          var t = localStorage.getItem("finflow-tema");
          var claro = t ? t === "claro" : window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = claro ? "light" : "dark";
          if (claro) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f5f7");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
